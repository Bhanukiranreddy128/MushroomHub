spring.application.name=mushroomhub-api
server.port=${PORT:8080}

# PostgreSQL Datasource Configuration (Aiven Cloud)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Secret Configuration
jwt.secret=${JWT_SECRET:MushroomHub_Dev_Secret_Key_For_Jwt_Token_Signing_Only_Do_Not_Use_In_Prod_2026!}

# Razorpay Configuration (Loaded securely from environment variables)
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=INR

# Dynamic Delivery Pricing Configuration (Configurable)
delivery.pricing.base-fee=30.0
delivery.pricing.per-km-fee=8.0
delivery.pricing.weight-threshold-kg=2.0
delivery.pricing.per-extra-kg-fee=5.0
delivery.pricing.express-surcharge=40.0
delivery.pricing.free-threshold=1000.0

# Brevo (Bravo) Transactional Email Service Configuration for Gmail OTP
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:noreply@mushroomhub.com}
brevo.sender.name=${BREVO_SENDER_NAME:MushroomHub Security}
